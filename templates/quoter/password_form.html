{% extends 'quoter/base.html' %}
{% block title %}修改密码 - 电缆报价系统{% endblock %}
{% block content %}
<h4 class="mb-3">修改密码</h4>

<div class="card" style="max-width:480px"><div class="card-body">
  <form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">原密码</label>
    <input type="password" name="old_password" class="form-control" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label">新密码</label>
    <input type="password" name="new_password1" class="form-control" required>
    <div class="form-text">至少 6 位，建议字母 + 数字</div>
  </div>
  <div class="mb-3">
    <label class="form-label">确认新密码</label>
    <input type="password" name="new_password2" class="form-control" required>
  </div>
  <button class="btn btn-primary">保存</button>
  </form>
</div></div>
{% endblock %}
