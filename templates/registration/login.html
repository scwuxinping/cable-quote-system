{% extends 'quoter/base.html' %}
{% block title %}登录 - 电缆报价系统{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h4 class="text-center mb-4">⚡ 电缆报价系统</h4>
        {% if form.errors %}
          <div class="alert alert-danger py-2">用户名或密码不正确</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100">登 录</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
